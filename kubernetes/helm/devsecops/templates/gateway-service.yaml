apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.services.gateway.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.services.gateway.name }}
spec:
  replicas: {{ .Values.services.gateway.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.services.gateway.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.services.gateway.name }}
    spec:
      serviceAccountName: {{ .Values.services.gateway.name }}
      automountServiceAccountToken: false
      containers:
        - name: {{ .Values.services.gateway.name }}
          image: "{{ .Values.services.gateway.image }}:{{ .Values.services.gateway.tag }}"
          imagePullPolicy: Always
          ports:
            - containerPort: {{ .Values.services.gateway.port }}
              protocol: TCP

          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.services.gateway.port }}
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.services.gateway.port }}
            initialDelaySeconds: 10
            periodSeconds: 20

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

---

apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.services.gateway.name }}
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: {{ .Values.services.gateway.name }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.services.gateway.port }}
      targetPort: {{ .Values.services.gateway.port }}
  type: ClusterIP
